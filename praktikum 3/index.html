<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 3 - Perulangan</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
        }
        table { 
            border-collapse: collapse; 
            margin-bottom: 24px; 
        }
        th, td { 
            border: 1px solid #94a3b8; 
            padding: 6px 12px; 
            text-align: center; 
        }
        th { 
            background: #1e3a8a; 
            color: white; 
        }
        /* Style untuk modifikasi baris dengan hasil genap (Pertanyaan Analisis No. 2) */
        .genap {
            background-color: #e2e8f0;
        }
        #totalSks {
            font-weight: bold;
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
    <h2>Tabel Perkalian</h2>
    <input type="number" id="angka" value="7" min="1" max="20">
    <button id="buat">Tampilkan</button>
    <table id="tabelKali"></table>

    <h2>Kartu Rencana Studi</h2>
    <table id="tabelMK"></table>
    <p id="totalSks"></p>
</body>
</html>
